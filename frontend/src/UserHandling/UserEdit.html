<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav></nav>

<form id="userForm">

    <h1>Rediger din profil</h1>

    <p id="firstnameBox">
        <label for="firstname" id="firstnameLabel">
            Fornavn:
            <input type="text" name="firstname" id="firstname" required>
        </label>
    </p>

    <p id="lastnameBox">
        <label for="lastname" id="lastnameLabel">
            Efternavn:
            <input type="text" name="lastname" id="lastname" required>
        </label>
    </p>

    <p id="usernameBox">
        <label for="username" id="usernameLabel">
            Brugernavn:
            <input type="text" name="username" id="username" required>
        </label>
    </p>

    <p id="phoneNumberBox">
        <label for="phoneNumber" id="phoneNumberLabel">
            Telefonnummer:
            <input type="text" name="phoneNumber" id="phoneNumber">
        </label>
    </p>

    <p id="addressBox">
        <label for="address" id="addressLabel">
            Adresse:
            <input type="text" name="address" id="address">
        </label>
    </p>

    <p id="zipcodeBox">
        <label for="zipcode" id="zipcodeLabel">
            PostNr:
            <input type="text" name="zipcode" id="zipcode">
        </label>
    </p>

    <p id="cityBox">
        <label for="city" id="cityLabel">
            By:
            <input type="text" name="city" id="city">
        </label>
    </p>

    <button type="submit" id="saveBtn">Gem</button>

</form>

<script src="../Login/auth.js"></script>
<script type="module" src="./UserProfile.js"></script>

</body>
</html>
